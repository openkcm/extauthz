# Every section under `config` that values.yaml documents, with the documented examples
# uncommented. TestConfigLoad loads the rendered config.yaml with ExtAuthZ's configuration
# loader, which rejects unknown keys. Keep this file in sync with the examples in values.yaml.
# Examples that exclude these ones (another form of the same setting) are in
# config-alternatives-*.yaml.
config:
  environment: staging
  labels: { team: kms }

  application:
    name: extauthz-eu10

  featureGates:
    enrich-header-with-client-type: true
    enrich-header-with-client-region: true

  logger:
    level: debug
    format: text
    source: true
    formatter:
      time:
        type: pattern
        pattern: "2006-01-02T15:04:05.000Z07:00"
      fields:
        level: level
        masking:
          pii: [subject]
          other: { payload: "[masked]" }

  status:
    enabled: true
    address: :8080
    profiling: false

  telemetry:
    traces:
      enabled: true
      protocol: grpc
      host: { source: env, env: OTEL_HOST }
      secretRef:
        type: mtls
        mtls:
          cert: { source: file, file: { path: /etc/credentials/otel/tls.crt, format: binary } }
          certKey: { source: file, file: { path: /etc/credentials/otel/tls.key, format: binary } }
          serverCa: { source: file, file: { path: /etc/credentials/otel/ca.crt, format: binary } }
    logs:
      enabled: true
      protocol: grpc
      host: { source: env, env: OTEL_HOST }
      secretRef:
        type: basic
        basic:
          username: { source: env, env: OTEL_USER }
          password: { source: env, env: OTEL_PASSWORD }
    metrics:
      enabled: true
      prometheus: { enabled: true }

  grpcServer:
    address: :9092
    flags:
      health: true
      reflection: false
    maxRecvMsgSize: 125829120
    efPolMinTime: 180s
    efPolPermitWithoutStream: false
    attributes:
      maxConnectionIdle: 1800s
      maxConnectionAge: 1800s
      maxConnectionAgeGrace: 300s
      time: 120m
      timeout: 20s
    client:
      attributes:
        keepaliveTime: 80s
        keepaliveTimeout: 40s
      pool:
        initialCapacity: 1
        maxCapacity: 1
        idleTimeout: 5s
        maxLifeDuration: 60s

  cedar:
    policyPath: /etc/extauthz-policies

  mtls:
    trustedSubjectsYaml: /etc/extauthz-mtls/trustedSubjects.yaml

  jwt:
    issuerClaimKeys: [iss]
    providers:
      - issuer: https://idp.example.com/realms/platform
        audiences: [cmk-api]
      - issuer: automation
        issuerURI: https://idp.example.com/realms/automation
        jwksURI: https://idp.example.com/realms/automation/protocol/openid-connect/certs
        audiences: [cmk-api, cmk-automation]
        disableTokenIntrospection: true
    httpClient:
      timeout: 5s
      basicAuth:
        username:
          source: file
          file: { path: /etc/credentials/idp/client-id, format: binary }
        password:
          source: file
          file: { path: /etc/credentials/idp/client-secret, format: binary }
    oauth2:
      credentials:
        authMethod: post
        clientSecret:
          source: file
          file: { path: /etc/credentials/tenant-introspection/client-secret, format: binary }

  sessionPathPrefixes: ["/cmk/v1/"]

  sessionManager:
    enabled: true
    address: session-manager.services.svc.cluster.local:9091
    secretRef:
      type: mtls
      mtls:
        cert:     { source: file, file: { path: /etc/credentials/sm/tls.crt, format: binary } }
        certKey:  { source: file, file: { path: /etc/credentials/sm/tls.key, format: binary } }
        serverCa: { source: file, file: { path: /etc/credentials/sm/ca.crt, format: binary } }
        attributes:
          serverName: session-manager.services.svc.cluster.local
    attributes:
      keepaliveTime: 80s
      keepaliveTimeout: 40s

  csrfSecret:
    source: file
    file: { path: /etc/credentials/csrf-secret/csrf_secret, format: binary }

  clientData:
    signingKeyIDFilePath: /etc/extauthz-signing/keyId

  audit:
    endpoint: https://otel-collector:4318/v1/logs
    httpClient:
      timeout: 10s
      mtls:
        cert:     { source: file, file: { path: /etc/credentials/audit/tls.crt, format: binary } }
        certKey:  { source: file, file: { path: /etc/credentials/audit/tls.key, format: binary } }
        serverCa: { source: file, file: { path: /etc/credentials/audit/ca.crt, format: binary } }
    additionalProperties: "{ service: extauthz, region: eu10 }"

  valkey:
    address: { value: valkey:6379 }
    user: { value: extauthz }
    password:
      source: file
      file: { path: /etc/credentials/valkey/password, format: binary }
    prefix: extauthz
    secretRef:
      type: mtls
      mtls:
        cert: { source: file, file: { path: /etc/credentials/valkey/tls.crt, format: binary } }
        certKey: { source: file, file: { path: /etc/credentials/valkey/tls.key, format: binary } }
        serverCa: { source: file, file: { path: /etc/credentials/valkey/ca.crt, format: binary } }
    masterSet: mymaster
    topologyRefreshInterval: 5s
    rateDetection:
      enabled: true
      threshold: 50
      window: 1m
      cooldown: 1m
      countUnknown: false
      queueSize: 1024
      workers: 4
      dispatchTimeout: 10s
