apiVersion: v2
type: application
name: extauthz
description: >-
  OpenKCM ExtAuthZ: external authorization for Envoy Gateway. Authenticates every
  request (client certificate, bearer token or browser session), evaluates Cedar
  policies, and adds signed client data for the backend.
home: https://openkcm.io/components/cmk/extauthz
sources:
  - https://github.com/openkcm/extauthz
keywords:
  - openkcm
  - cmk
  - envoy
  - ext-authz
  - authorization
# Version of the chart. Increment it for every change to the chart.
# Versions follow Semantic Versioning (https://semver.org/).
version: 0.15.0
# ExtAuthZ release this chart deploys by default: the tag of its image. release-please updates
# it in each release pull request (marker on the line). Increase `version` in the same pull
# request, otherwise the chart release workflow skips the already-published chart version.
appVersion: "v0.14.0" # x-release-please-version
