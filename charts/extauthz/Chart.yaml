apiVersion: v2
type: application
name: extauthz
description: >-
  OpenKCM ExtAuthZ: external authorization for Envoy Gateway. Authenticates every
  request (client certificate, bearer token or browser session), evaluates Cedar
  policies, and adds signed client data for the backend.
home: https://openkcm.io/components/cmk/extauthz
sources:
  - https://github.com/openkcm/extauthz
keywords:
  - openkcm
  - cmk
  - envoy
  - ext-authz
  - authorization
# Version of the chart. Increment it for every change to the chart.
# Versions follow Semantic Versioning (https://semver.org/).
version: 0.15.0
# ExtAuthZ release this chart is made for: the tag of its image, and the default of image.tag.
# The workflow update-app-versions opens a pull request when openkcm/extauthz has a newer release.
appVersion: "v0.14.0"
