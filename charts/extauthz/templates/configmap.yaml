{{- /* ExtAuthZ crashes at startup when the Session Manager client has no secretRef. */}}
{{- with .Values.config.sessionManager }}
{{- if and .enabled (not .secretRef) }}
{{- fail "config.sessionManager.enabled is true but config.sessionManager.secretRef is not set (ExtAuthZ would crash at startup). Set secretRef.type to mtls with the client certificate, or to insecure inside a service mesh with mutual TLS." }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "extauthz.configMapName" . }}
  namespace: {{ include "extauthz.namespace" . }}
  labels:
    {{- include "extauthz.labels" . | nindent 4 }}
  {{- with .Values.configMap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
immutable: {{ include "extauthz.configImmutable" . | eq "true" }}
data:
  config.yaml: |-
    {{- include "extauthz.config" . | nindent 4 }}
