# Signing key of the client data. The chart mounts this Secret at /etc/extauthz-signing:
#   keyId        the ID of the active key (here key1); CMK finds the public key by this ID
#   <keyId>.pem  the RSA private key, PKCS #8 (-----BEGIN PRIVATE KEY-----) or PKCS #1
# Create the Secret from files rather than applying this example with a key pasted in:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out key1.pem
#   kubectl create secret generic extauthz-signing-keys-secret \
#     --from-literal=keyId=key1 --from-file=key1.pem=key1.pem
# CMK needs the matching public key: openssl pkey -in key1.pem -pubout -out key1.pub.pem
apiVersion: v1
kind: Secret
metadata:
  name: extauthz-signing-keys-secret
type: Opaque
stringData:
  keyId: key1
  key1.pem: |
    -----BEGIN PRIVATE KEY-----
    …
    -----END PRIVATE KEY-----
